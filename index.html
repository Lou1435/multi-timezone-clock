<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🌍 Multi-Timezone Clock</h1>
        <p class="subtitle">Current time around the world</p>
        
        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="Search timezone...">
            <select id="themeToggle" class="theme-toggle">
                <option value="dark">🌙 Dark Theme</option>
                <option value="light">☀️ Light Theme</option>
            </select>
        </div>

        <div class="clocks-container" id="clocksContainer">
            <!-- Clocks will be generated by JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
